    #ekho-error-box { display: none; position: fixed; inset: 0; padding: 2rem; background: #1a0000; color: #ff6b6b; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; z-index: 99999; overflow: auto; }

<body>
  <script>
    function showError(msg) {
      var el = document.getElementById('ekho-error-box');
      if (!el) {
        el = document.createElement('div');
        el.id = 'ekho-error-box';
        el.style.cssText = 'display:block;position:fixed;inset:0;padding:2rem;background:#1a0000;color:#ff6b6b;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;z-index:99999;overflow:auto;';
        document.body.appendChild(el);
      } else {
        el.style.display = 'block';
      }
      el.textContent += msg + '\n';
    }
    window.onerror = function (m, source, line, col, err) {
      showError('[JS ERROR] ' + (err ? (err.stack || err.message) : m));
      return true;
    };
    window.addEventListener('unhandledrejection', function (e) {
      showError('[PROMISE] ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e));
    });
  </script>
  <div id="root"></div>

</body>
