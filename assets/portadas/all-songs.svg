<svg width="100%" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="glowTop" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="320" height="320" fill="url(#glowTop)" opacity="0.6"/>

  <!-- Grid -->
  <line x1="0" y1="80" x2="320" y2="80" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="160" x2="320" y2="160" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="240" x2="320" y2="240" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>
  <line x1="80" y1="0" x2="80" y2="320" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>
  <line x1="160" y1="0" x2="160" y2="320" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>
  <line x1="240" y1="0" x2="240" y2="320" stroke="#a855f7" stroke-width="0.4" opacity="0.2"/>

  <!-- Equalizer bars (full height, centered at y=160) -->
  <rect x="20" y="60" width="32" height="200" rx="6" fill="#7c3aed" opacity="0.9"/>
  <rect x="60" y="30" width="32" height="260" rx="6" fill="#9333ea" opacity="0.9"/>
  <rect x="100" y="10" width="32" height="300" rx="6" fill="#a855f7" opacity="0.9"/>
  <rect x="140" y="60" width="32" height="200" rx="6" fill="#c084fc" opacity="0.95"/>
  <rect x="180" y="20" width="32" height="280" rx="6" fill="#a855f7" opacity="0.9"/>
  <rect x="220" y="50" width="32" height="220" rx="6" fill="#9333ea" opacity="0.9"/>
  <rect x="260" y="80" width="32" height="160" rx="6" fill="#7c3aed" opacity="0.9"/>

  <!-- Glow on center bars -->
  <rect x="100" y="10" width="32" height="40" rx="6" fill="white" opacity="0.08"/>
  <rect x="140" y="60" width="32" height="30" rx="6" fill="white" opacity="0.08"/>
  <rect x="180" y="20" width="32" height="35" rx="6" fill="white" opacity="0.08"/>

  <!-- Large music note -->
  <g transform="translate(270, 30) scale(1.3)">
    <line x1="8" y1="10" x2="8" y2="46" stroke="#c084fc" stroke-width="2.5" opacity="0.85"/>
    <path d="M8 10 Q28 18 24 34" stroke="#c084fc" stroke-width="2.5" fill="none" opacity="0.85"/>
    <ellipse cx="1" cy="48" rx="10" ry="7" transform="rotate(-20 1 48)" fill="#c084fc" opacity="0.85"/>
  </g>
</svg>
